<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MULTI-GAMES CYBER VIP 🎮</title>

    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --bg-dark: #030712;
            --glow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .fast-cyber-bg {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(0, 255, 102, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #030712 0%, #080e1e 100%);
        }

        .app-overlay {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(3, 7, 18, 0.85);
        }

        .cyber-ticker {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(10, 15, 30, 0.95);
            border-bottom: 2px solid var(--neon-blue);
            color: var(--neon-blue); font-size: 0.78rem; padding: 8px 15px;
            text-align: center; z-index: 100; overflow: hidden; white-space: nowrap;
        }
        .cyber-ticker span {
            display: inline-block; animation: tickerSlide 16s linear infinite;
        }
        @keyframes tickerSlide { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .login-card {
            background: rgba(15, 23, 42, 0.95);
            width: 88%; max-width: 360px; padding: 30px 20px;
            border-radius: 20px; border: 2px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25); text-align: center;
            position: relative; z-index: 20;
        }
        .login-card h2 {
            font-size: 1.3rem; letter-spacing: 2px;
            color: var(--neon-blue); margin-bottom: 12px; font-weight: 900;
        }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 10px; border: 1px solid var(--neon-blue);
            background: rgba(3, 7, 18, 0.9); color: var(--neon-blue);
            text-align: center; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }

        .cyber-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(90deg, var(--neon-blue), #0066ff);
            color: #fff; font-weight: bold; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); transition: transform 0.1s;
        }
        .cyber-btn:active { transform: scale(0.98); }

        .carousel-container {
            width: 100%; height: 320px;
            position: relative; display: flex; justify-content: center; align-items: center; margin-top: 10px;
        }
        .carousel-wheel {
            width: 220px; height: 290px; position: relative;
        }
        .carousel-card {
            position: absolute; inset: 0;
            border-radius: 18px; background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--neon-blue);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 15px; gap: 12px; cursor: pointer;
            opacity: 0; transform: scale(0.85); transition: all 0.25s ease-out; pointer-events: none;
        }
        .carousel-card.active {
            opacity: 1; transform: scale(1); pointer-events: auto;
            border-color: var(--neon-green); box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
        }
        .game-icon-large { font-size: 4rem; }
        .game-title-large { font-size: 1.2rem; font-weight: bold; color: #fff; }

        .carousel-controls { display: flex; gap: 15px; margin-top: 5px; align-items: center; }
        .nav-btn {
            width: 46px; height: 46px; border-radius: 50%;
            border: 2px solid var(--neon-blue); background: rgba(10, 15, 30, 0.9);
            color: var(--neon-blue); font-size: 1.3rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .radar-box {
            width: 90px; height: 90px; border-radius: 50%;
            border: 2px solid var(--neon-blue); position: relative; margin-bottom: 15px;
            overflow: hidden; background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, transparent 70%);
        }
        .radar-box::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 50%;
            background: linear-gradient(45deg, var(--neon-blue), transparent);
            transform-origin: 0 0; animation: radarSweep 1.2s linear infinite;
        }
        @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .game-screen { 
            position: absolute; inset: 0;
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            z-index: 50; background: #030712; 
        }
        .game-header {
            padding: 12px 15px; background: rgba(10, 15, 30, 0.95);
            border-bottom: 2px solid var(--neon-blue); display: flex; justify-content: space-between; align-items: center;
            margin-top: 30px;
        }
        .back-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--neon-blue); background: rgba(0, 240, 255, 0.1); color: var(--neon-blue); font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .attempts-hud { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 102, 0.1); font-family: monospace; font-weight: bold; font-size: 0.85rem; }

        .grid-5x5 {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
            width: 100%; max-width: 340px; margin: auto; padding: 12px;
            background: rgba(10, 15, 30, 0.95); border: 2px solid var(--neon-blue);
            border-radius: 16px;
        }
        .grid-cell {
            height: 48px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer;
        }

        .apple-board { flex: 1; display: flex; flex-direction: column-reverse; gap: 6px; padding: 10px; overflow-y: auto; align-items: center; }
        .apple-row { display: flex; gap: 6px; align-items: center; width: 100%; max-width: 330px; opacity: 0.35; pointer-events: none; }
        .apple-row.active { opacity: 1; pointer-events: auto; }
        .apple-cell {
            flex: 1; height: 38px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .apple-cell.revealed-apple { background: rgba(0,255,102,0.2); border-color: var(--neon-green); }
        .apple-cell.revealed-bomb { background: rgba(255,0,85,0.2); border-color: var(--neon-pink); }
        .reveal-btn {
            padding: 6px 10px; border-radius: 6px; border: none;
            background: linear-gradient(90deg, var(--neon-blue), #0066ff);
            color: #fff; font-weight: bold; font-size: 0.75rem; cursor: pointer;
        }

        .mine-container { background: rgba(10, 15, 30, 0.95); padding: 18px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%; border: 2px solid var(--neon-blue); margin: auto; }
        .mine-mode-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
        .mine-mode-btn { background: rgba(15,23,42,0.9); color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 15px; font-size: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; }
        .mine-header-info { display: flex; justify-content: space-between; background: rgba(15,23,42,0.9); color: var(--neon-blue); padding: 8px 12px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; font-size: 12px; border: 1px solid var(--neon-blue); }
        .ladder { display: flex; flex-direction: column-reverse; gap: 6px; margin-bottom: 10px; }
        .row-level { display: flex; gap: 6px; justify-content: center; opacity: 0.35; pointer-events: none; }
        .row-level.active { opacity: 1; pointer-events: auto; }
        .mine-box { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; height: 38px; flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #aaa; font-weight: bold; cursor: pointer; }
        .mine-box.active-box { border-color: var(--neon-blue); color: #fff; background: rgba(0, 240, 255, 0.15); }

        .admin-panel {
            width: 88%; max-width: 400px; background: rgba(10, 15, 30, 0.98);
            border: 2px solid var(--neon-green); border-radius: 16px; padding: 18px;
            max-height: 85vh; overflow-y: auto;
        }
        .id-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.78rem; }
        .id-table th, .id-table td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
    </style>
</head>
<body>

<div class="fast-cyber-bg"></div>

<div class="cyber-ticker">
    <span>⚡ [ CYBER MATRIX VIP SYSTEM ONLINE ] &nbsp;&bull;&nbsp; [ SERVER PING: <span id="ping-hud">12</span>ms ] &nbsp;&bull;&nbsp; [ التشفير الكوني نشط 🟢 ]</span>
</div>

<!-- شاشة تسجيل الدخول -->
<div id="screen-login" class="app-overlay">
    <div class="login-card">
        <h2>CYBER ACCESS 🔐</h2>
        <p style="font-size: 0.78rem; color: var(--neon-blue); margin-bottom: 12px;">أدخل كود الاشتراك أو الـ ID لتأكيد الصلاحية</p>
        <input type="password" id="pass-input" placeholder="أدخل الـ ID هنا..." autocomplete="off">
        <button class="cyber-btn" onclick="checkLogin()">دخول النظام VIP 🚀</button>
    </div>
</div>

<!-- لوحة التحكم للمالك -->
<div id="screen-admin" class="app-overlay" style="display: none;">
    <div class="admin-panel">
        <h3 style="color: var(--neon-green); text-align: center; margin-bottom: 12px; font-size: 1.1rem;">لوحة التحكم والاشتراكات ⚙️</h3>
        <div style="background: rgba(0,240,255,0.05); padding: 8px; border-radius: 8px; border: 1px solid var(--neon-blue); margin-bottom: 8px;">
            <p style="font-size: 0.75rem; color: var(--neon-blue);">تفعيل ID جديد للعميل:</p>
            <input type="text" id="new-client-id" placeholder="رقم الـ ID" style="padding: 6px; margin: 4px 0; font-size:0.85rem;">
            <select id="new-client-attempts" style="width: 100%; padding: 6px; border-radius: 6px; background: #000; color: #fff; border: 1px solid var(--neon-blue); margin-bottom: 4px; font-size:0.82rem;">
                <option value="1">1 محاولة</option>
                <option value="3" selected>3 محاولات</option>
                <option value="5">5 محاولات</option>
            </select>
            <button class="cyber-btn" onclick="addClientId()" style="padding: 6px; font-size:0.82rem;">حفظ وتفعيل الـ ID ⚡</button>
        </div>
        <div style="max-height: 110px; overflow-y: auto;">
            <table class="id-table">
                <thead><tr><th>الـ ID</th><th>المحاولات</th><th>إجراء</th></tr></thead>
                <tbody id="ids-table-body"></tbody>
            </table>
        </div>
        <button class="cyber-btn" style="background: #333; margin-top: 10px; padding: 6px; font-size:0.82rem;" onclick="showScreen('screen-login')">إغلاق اللوحة ❌</button>
    </div>
</div>

<!-- قائمة الألعاب -->
<div id="screen-lobby" class="app-overlay" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 88%; max-width: 600px; margin-top: 20px;">
        <h2 style="font-size: 1.2rem; color: #fff;">اختر اللعبة 🎮</h2>
        <div id="global-attempts-hud" class="attempts-hud">🎮 المحاولات: 3</div>
    </div>
    <div class="carousel-container">
        <div class="carousel-wheel" id="carousel-wheel"></div>
    </div>
    <div class="carousel-controls">
        <button class="nav-btn" onclick="rotateCarousel(-1)">❮</button>
        <button class="cyber-btn" style="width: 140px; padding:10px;" onclick="launchSelectedGame()">تشغيل اللعبة 🚀</button>
        <button class="nav-btn" onclick="rotateCarousel(1)">❯</button>
    </div>
</div>

<!-- شاشة الرادار -->
<div id="screen-radar" class="app-overlay" style="display: none;">
    <div class="radar-box"></div>
    <div id="radar-status-text" style="font-size: 0.95rem; color: var(--neon-blue); font-weight: bold;">جاري سحب بيانات السيرفر...</div>
</div>

<!-- واجهات الألعاب المباشرة -->
<div id="screen-game-container" class="game-screen" style="display: none;">
    <div class="game-header">
        <button class="back-btn" onclick="showScreen('screen-lobby')">⬅ القائمة</button>
        <span id="active-game-title" style="font-weight: bold; color: var(--neon-blue); font-size:0.95rem;">لعبة Apple</span>
        <div id="game-attempts-hud" class="attempts-hud">🎮 3</div>
    </div>
    <div id="game-board-area" style="flex: 1; display: flex; align-items: center; justify-content: center;"></div>
</div>

<script>
    // --- 1. Security & Local DB ---
    const MASTER_KEY = "VIP_CYBER_MASTER_DB";
    function getDB() {
        let db = localStorage.getItem(MASTER_KEY);
        if(!db) { let def = { ids: {} }; localStorage.setItem(MASTER_KEY, JSON.stringify(def)); return def; }
        return JSON.parse(db);
    }
    function saveDB(data) { localStorage.setItem(MASTER_KEY, JSON.stringify(data)); }
    let activeClientId = null;

    function checkLogin() {
        let val = document.getElementById('pass-input').value.trim();
        if(!val) return alert("يرجى إدخال رقم الـ ID الخاص بك!");
        if(val === "Walhyma3rf") { renderAdminTable(); showScreen('screen-admin'); return; }
        let db = getDB();
        if(db.ids[val]) {
            if(db.ids[val].attempts <= 0) {
                return alert("عذراً! انتهت جميع المحاولات الخاصة بهذا الـ ID. يرجى التواصل مع المالك.");
            }
            activeClientId = val;
            updateAttemptsHUD();
            triggerRadarLoading(() => { showScreen('screen-lobby'); });
        } else {
            alert("خطأ: هذا الـ ID غير مفعل! يرجى التواصل مع المالك للتفعيل.");
        }
    }

    function deductAttempt() {
        if (!activeClientId) return true;
        let db = getDB();
        if (db.ids[activeClientId]) {
            if (db.ids[activeClientId].attempts > 0) {
                db.ids[activeClientId].attempts -= 1;
                saveDB(db);
                updateAttemptsHUD();
                return true;
            } else {
                alert("استنفدت عدد المحاولات المتاحة لهذا الـ ID (0 محاولة)! يرجى التواصل مع المالك.");
                showScreen('screen-lobby');
                return false;
            }
        }
        return true;
    }

    function addClientId() {
        let idVal = document.getElementById('new-client-id').value.trim();
        let attemptsVal = parseInt(document.getElementById('new-client-attempts').value);
        if(!idVal) return alert("أدخل رقم ID صحيح!");
        let db = getDB();
        db.ids[idVal] = { attempts: attemptsVal };
        saveDB(db);
        document.getElementById('new-client-id').value = "";
        renderAdminTable();
        alert(`تم تفعيل الـ ID (${idVal}) بـ ${attemptsVal} محاولات بنجاح!`);
    }

    function renderAdminTable() {
        let db = getDB();
        let tbody = document.getElementById('ids-table-body');
        tbody.innerHTML = "";
        Object.keys(db.ids).forEach(id => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${id}</td><td>${db.ids[id].attempts}</td><td><button onclick="deleteId('${id}')" style="background:none; border:none; color:red; cursor:pointer;">❌</button></td>`;
            tbody.appendChild(tr);
        });
    }

    function deleteId(id) {
        let db = getDB();
        delete db.ids[id];
        saveDB(db);
        renderAdminTable();
    }

    function updateAttemptsHUD() {
        let db = getDB();
        let att = 3;
        if(activeClientId && db.ids[activeClientId]) { att = db.ids[activeClientId].attempts; }
        document.getElementById('global-attempts-hud').innerText = `🎮 المحاولات: ${att}`;
        document.getElementById('game-attempts-hud').innerText = `🎮 ${att}`;
    }

    // --- 2. Carousel ---
    const gamesList = [
        { id: 'apple', title: 'Apple 🍎', icon: '🍎' },
        { id: 'gems', title: 'Gems & Mines 💎', icon: '💎' },
        { id: 'royal', title: 'Royal Feast 🍗', icon: '🍗' },
        { id: 'goldmine', title: 'Wild West Gold ⛏️', icon: '⛏️' },
        { id: 'crash', title: 'Crash ✈️', icon: '✈️' }
    ];
    let currentCardIndex = 0;
    const wheel = document.getElementById('carousel-wheel');

    function buildCarousel() {
        wheel.innerHTML = "";
        gamesList.forEach((game, index) => {
            const card = document.createElement('div');
            card.className = `carousel-card ${index === 0 ? 'active' : ''}`;
            card.id = `card-${index}`;
            card.innerHTML = `<span class="game-icon-large">${game.icon}</span><span class="game-title-large">${game.title}</span>`;
            wheel.appendChild(card);
        });
    }
    buildCarousel();

    function rotateCarousel(dir) {
        currentCardIndex = (currentCardIndex + dir + gamesList.length) % gamesList.length;
        Array.from(wheel.children).forEach((card, idx) => {
            if(idx === currentCardIndex) card.classList.add('active');
            else card.classList.remove('active');
        });
    }

    function launchSelectedGame() {
        let currentGame = gamesList[currentCardIndex];
        if(currentGame.id === 'crash') return alert("هذه اللعبة غير متوفرة حالياً!");
        
        if (!deductAttempt()) return;

        triggerRadarLoading(() => {
            document.getElementById('active-game-title').innerText = currentGame.title;
            renderGameBoard(currentGame.id);
            showScreen('screen-game-container');
        });
    }

    function triggerRadarLoading(callback) {
        showScreen('screen-radar');
        let statusText = document.getElementById('radar-status-text');
        let steps = ["جاري الربط مع سيرفر VIP...", "فك تشفير الخلايا...", "تأكيد الإشارات الحية...", "تم الاستخراج بنجاح!"];
        let idx = 0;
        let interval = setInterval(() => {
            if(idx < steps.length) { statusText.innerText = steps[idx]; idx++; }
            else { clearInterval(interval); if(callback) callback(); }
        }, 400);
    }

    // دالة إظهار وإخفاء الشاشات
    function showScreen(screenId) {
        document.querySelectorAll('.app-overlay, .game-screen').forEach(s => s.style.display = 'none');
        let targetScreen = document.getElementById(screenId);
        if (targetScreen) {
            targetScreen.style.display = 'flex';
        }
    }

    // --- 3. Game Boards ---
    function renderGameBoard(gameId) {
        const area = document.getElementById('game-board-area');
        area.innerHTML = "";

        if(gameId === 'gems') {
            const grid = document.createElement('div');
            grid.className = 'grid-5x5';
            let allIndices = [];
            for(let i=0; i<25; i++) allIndices.push(i);
            let bombIndices = allIndices.sort(() => Math.random() - 0.5).slice(0, 2);

            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = '❓';
                cell.onclick = () => {
                    if(bombIndices.includes(i)) {
                        cell.innerText = '💣'; cell.style.borderColor = 'var(--neon-pink)';
                    } else {
                        cell.innerText = '💎'; cell.style.borderColor = 'var(--neon-green)';
                    }
                };
                grid.appendChild(cell);
            }
            area.appendChild(grid);
        } 
        else if(gameId === 'apple') {
            const board = document.createElement('div');
            board.className = 'apple-board';
            let activeAppleRow = 0;

            let rowsData = [];
            for(let r=0; r<10; r++) {
                let bombCount = 1;
                if (r >= 4 && r <= 6) { bombCount = 2; }
                else if (r >= 7 && r <= 8) { bombCount = 3; }
                else if (r === 9) { bombCount = 4; }

                let bombs = [];
                while(bombs.length < bombCount) {
                    let randIdx = Math.floor(Math.random() * 5);
                    if(!bombs.includes(randIdx)) bombs.push(randIdx);
                }
                rowsData.push(bombs);
            }

            for(let r=0; r<10; r++) {
                const row = document.createElement('div');
                row.className = `apple-row ${r === 0 ? 'active' : ''}`;
                row.id = `apple-row-${r}`;

                for(let c=0; c<5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'apple-cell'; cell.innerText = '🔒';
                    row.appendChild(cell);
                }

                const btn = document.createElement('button');
                btn.className = 'reveal-btn';
                btn.innerText = `كشف الصف (${r+1})`;
                btn.onclick = () => {
                    if (r !== activeAppleRow) return;
                    let cells = row.querySelectorAll('.apple-cell');
                    let bombs = rowsData[r];
                    for(let c=0; c<5; c++) {
                        if(bombs.includes(c)) {
                            cells[c].innerText = '💣'; cells[c].className = 'apple-cell revealed-bomb';
                        } else {
                            cells[c].innerText = '🍎'; cells[c].className = 'apple-cell revealed-apple';
                        }
                    }
                    btn.style.display = 'none';
                    activeAppleRow++;
                    if(activeAppleRow < 10) {
                        let nextRow = document.getElementById(`apple-row-${activeAppleRow}`);
                        if(nextRow) nextRow.classList.add('active');
                    } else {
                        alert("تهانينا! تم اجتياز شجرة التفاحة بنجاح 🏆");
                    }
                };
                row.appendChild(btn);
                board.appendChild(row);
            }
            area.appendChild(board);
        } 
        else if(gameId === 'royal') {
            const grid = document.createElement('div');
            grid.className = 'grid-5x5';
            
            let poisonDistribution = [1, 2, 2, 2, 3].sort(() => Math.random() - 0.5);
            let poisonIndices = [];

            for(let r = 0; r < 5; r++) {
                let poisonCountInRow = poisonDistribution[r];
                let rowCols = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5);
                let chosenCols = rowCols.slice(0, poisonCountInRow);
                chosenCols.forEach(col => poisonIndices.push(r * 5 + col));
            }

            let foodTypes = ['🍗', '🥩', '🍰', '🍕'];

            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = '❓';
                cell.onclick = () => {
                    if(poisonIndices.includes(i)) {
                        cell.innerText = '☠️'; cell.style.borderColor = 'var(--neon-pink)';
                    } else {
                        cell.innerText = foodTypes[Math.floor(Math.random() * foodTypes.length)];
                        cell.style.borderColor = 'var(--neon-green)';
                    }
                };
                grid.appendChild(cell);
            }
            area.appendChild(grid);
        }
        else if(gameId === 'goldmine') {
            const container = document.createElement('div');
            container.className = 'mine-container';
            container.innerHTML = `
                <h1 style="color: var(--neon-blue); margin-bottom: 10px; font-size: 15px;">🛡️ Wild West Gold 🔓</h1>
                <p style="color: #aaa; margin-bottom: 10px; font-size: 11px;">اختر نظام اللعب للبدء:</p>
                <div class="mine-mode-buttons">
                    <button class="mine-mode-btn" onclick="initMineSession(2)">وضع 2x</button>
                    <button class="mine-mode-btn" onclick="initMineSession(3)">وضع 3x</button>
                </div>
                <div id="mine-game-area" style="display:none; margin-top:12px;">
                    <div class="mine-header-info">
                        <div>الحالة: <span style="color: var(--neon-green);">متصل 🟢</span></div>
                        <div>الخطوة: <span id="mine-step">1</span> / 6</div>
                    </div>
                    <div class="ladder" id="mine-ladder"></div>
                    <button class="cyber-btn" style="margin-top:8px; padding:6px; font-size:0.8rem;" onclick="renderGameBoard('goldmine')">إعادة تعيين 🔄</button>
                </div>
            `;
            area.appendChild(container);
        }
    }

    let mineMode = 2, mineStep = 0, winningPaths = [];
    function initMineSession(mode) {
        mineMode = mode; mineStep = 0; winningPaths = [];
        for(let i=0; i<6; i++) winningPaths.push(Math.floor(Math.random() * mode));
        
        document.querySelector('.mine-mode-buttons').style.display = 'none';
        document.getElementById('mine-game-area').style.display = 'block';
        buildLadder();
    }

    function buildLadder() {
        const ladder = document.getElementById('mine-ladder');
        ladder.innerHTML = "";
        for(let i=0; i<6; i++) {
            const row = document.createElement('div');
            row.className = `row-level ${i === mineStep ? 'active' : ''}`;
            row.id = `mine-row-${i}`;

            for(let j=0; j<mineMode; j++) {
                const box = document.createElement('div');
                box.className = `mine-box ${i === mineStep ? 'active-box' : ''}`;
                box.innerText = i === mineStep ? "🔍 اكشف" : "🔒 مغلق";
                
                box.onclick = () => {
                    if(i !== mineStep) return;
                    let correct = winningPaths[i];
                    let boxes = row.querySelectorAll('.mine-box');
                    
                    for(let k=0; k<mineMode; k++) {
                        boxes[k].onclick = null;
                        if(k === correct) {
                            boxes[k].innerHTML = "🪙 ذهب"; boxes[k].style.background = "rgba(0,255,102,0.2)"; boxes[k].style.borderColor = "var(--neon-green)";
                        } else {
                            boxes[k].innerHTML = "🧨 ديناميت"; boxes[k].style.background = "rgba(255,0,85,0.2)"; boxes[k].style.borderColor = "var(--neon-pink)";
                        }
                    }

                    mineStep++;
                    if(mineStep < 6) {
                        document.getElementById('mine-step').innerText = mineStep + 1;
                        let nextRow = document.getElementById(`mine-row-${mineStep}`);
                        if(nextRow) {
                            nextRow.classList.add('active');
                            let nextBoxes = nextRow.querySelectorAll('.mine-box');
                            nextBoxes.forEach(nb => {
                                nb.classList.add('active-box'); nb.innerText = "🔍 اكشف";
                            });
                        }
                    } else {
                        alert("تهانينا! وصلت للقمة بنجاح 🏆");
                    }
                };
                row.appendChild(box);
            }
            ladder.appendChild(row);
        }
    }
</script>
</body>
</html>
