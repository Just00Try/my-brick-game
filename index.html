<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT - PREDICTOR VIP 🎮</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-blue: #00f0ff; --neon-pink: #ff0055; --neon-green: #00ff66; --bg-dark: #030712; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); font-family: Tahoma, sans-serif; color: #fff; }
        .app-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(3, 7, 18, 0.9); padding: 15px; overflow-y: auto; }
        .login-card { background: #0f172a; width: 100%; max-width: 360px; padding: 20px; border-radius: 20px; border: 2px solid var(--neon-blue); text-align: center; }
        .login-card h2 { color: var(--neon-blue); margin-bottom: 10px; font-weight: 900; }
        .type-selector { display: flex; gap: 8px; margin: 10px 0; }
        .type-option { flex: 1; padding: 8px; background: #030712; border: 1px solid var(--neon-blue); border-radius: 8px; color: #aaa; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .type-option.selected { background: rgba(0, 240, 255, 0.15); border-color: var(--neon-green); color: var(--neon-green); }
        .rules-box { background: rgba(0, 240, 255, 0.04); border: 1px dashed var(--neon-blue); border-radius: 8px; padding: 8px; margin-bottom: 10px; font-size: 0.75rem; text-align: right; color: #cbd5e1; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--neon-blue); background: #030712; color: var(--neon-blue); text-align: center; outline: none; }
        .cyber-btn { width: 100%; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(90deg, var(--neon-blue), #0066ff); color: #fff; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .guest-btn { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--neon-green); background: rgba(0, 255, 102, 0.08); color: var(--neon-green); font-weight: bold; cursor: pointer; margin-top: 8px; }
        .attempts-hud { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 102, 0.1); font-family: monospace; font-weight: bold; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="screen-login" class="app-overlay">
    <div class="login-card">
        <h2>CYBER ACCESS 🔐</h2>
        <div class="type-selector">
            <div id="opt-new" class="type-option selected" onclick="selectUserType('new')">👤 لاعب جديد</div>
            <div id="opt-registered" class="type-option" onclick="selectUserType('registered')">⭐ لاعب حالي</div>
        </div>
        <div id="rules-text" class="rules-box">💡 اكتب الـ ID الخاص بك لطلب التفعيل (شحن 200 جنيه).</div>
        <input type="password" id="pass-input" placeholder="أدخل الـ ID الخاص بك..." autocomplete="off">
        <button id="submit-btn" class="cyber-btn" onclick="handleAuthAction()">طلب تفعيل التوقعات ⚡</button>
        <button class="guest-btn" onclick="enterGuestMode()">👁️ جلسة زيارة للمعاينة</button>
    </div>
</div>
